[workspace]
resolver = "3"
members = ["engine", "games/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
engine = { path = "engine" }
winit = "0.30.13"
wgpu = "30.0.1"
pollster = "1.0.1"
log = "0.4.34"
env_logger = "0.11.11"
glam = "0.34.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
fontdue = "0.9.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
