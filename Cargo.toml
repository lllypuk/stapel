[workspace]
resolver = "3"
members = ["engine", "games/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
engine = { path = "engine" }
winit = "0.30.13"
wgpu = "30.0.1"
pollster = "1.0.1"
log = "0.4.34"
env_logger = "0.11.11"
glam = "0.34.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
fontdue = "0.9.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
hound = "3.5.1"
lewton = "0.10.2"
rtrb = "0.3.5"
cpal = "0.16.0"
allocation-counter = "0.8.1"
egui = { version = "0.36.2", default-features = false }
egui-winit = { version = "0.36.2", default-features = false, features = ["wayland", "x11"] }
egui-wgpu = { version = "0.36.2", default-features = false }

# Полный декод музыки в debug без оптимизаций занимает секунды.
[profile.dev.package.lewton]
opt-level = 3

[profile.dev.package.ogg]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Координаты и размеры в f32 — норма графики.
cast_precision_loss = "allow"
# Игре-потребителю пометка ничего не даёт, а срабатываний десятки.
must_use_candidate = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
