# Склейка с окном, циклом событий, поверхностью и звуковой картой (`fill` под тестами в audio/mod.rs, логика поверхности — в surface.rs): проверяется запуском игры.
# renderer.rs — глобом: мутанты «delete field» в cargo-mutants 27.1 не фильтруются exclude_re.
exclude_globs = ["engine/src/app.rs", "engine/src/renderer.rs", "engine/src/audio/device.rs"]
exclude_re = [
    # fn main игр и stapel::run открывают окно; глоб по main.rs выключил бы логику игр.
    "replace main -> ",
    " in main$",
    "replace run -> ",
    # | и ^ на непересекающихся битовых флагах wgpu дают одно и то же.
    "replace \\| with \\^ in (GpuTextures::upload|instance_buffer|palette_buffer|Canvas::read_rgba)$",
    # Левый край твёрдой клетки ровно под центром — круг уже в стене, из корректного положения недостижимо.
    "replace > with >= in slide$",
    # Расстояние ровно PICKUP до предмета — граница нулевой меры, ходьбой не воспроизводится.
    "replace < with <= in touches_item$",
    # Форма волны мерцания произвольна; тесты держат границы, разброс, разницу факелов и зависимость от тика.
    "replace [+*] with [-+*/] in flicker$",
    # Соседи ячейки склейки перебираются по −1..=1 — вычитание обходит те же ячейки.
    "replace \\+ with - in Welder::id$",
    # Вычитание обходит тех же четырёх соседей в другом порядке: длина кратчайшего пути та же.
    "replace \\+ with - in Obstacles::path$",
    # Вызовы `beside` спрашивают пары E и W или всех четырёх соседей: вычитание меняет их местами.
    "replace \\+ with - in beside$",
    # Ничья — луч ровно в угол: шаг через любую из двух граней не проскакивает между клетками.
    "replace < with <= in Obstacles::ray$",
    # При b = 0 и снаружи круга дискриминант −c < 0: промах и без условия на b.
    "replace < with <= in Target::entry$",
    # Вход в круг ровно на расстоянии стены или конца шага — граница нулевой меры; в следующем тике снаряд уже касается круга.
    "replace < with <= in nearest$",
    # Равные расстояния до двух рёбер — только в их общей вершине, оба дают её.
    "replace < with <= in closest_point$",
    # Ровно на боку или ровно на −10 м — граница нулевой меры, физикой не воспроизводится.
    "replace < with <= in Racing::auto_respawn$",
    # Нулевая оставшаяся глубина прибавляет к сдвигу ноль.
    "replace > with >= in solve_contacts$",
    # Audio в тестах игры немой: голос не стартует, и Set со Stop недостижимы; решение — в проверенном command.
    " in Racing::update_sound$",
    "replace Racing::update_sound with \\(\\)$",
    # Audio в тестах игры немой: отправку не наблюдать; команды проверены в sound_commands.
    " in Shooter::update_sound$",
    "replace Shooter::update_sound with \\(\\)$",
    # Обороты ровно на пороге переключения — граница нулевой меры.
    "replace (> with >=|< with <=) in Rpm::tick$",
    # Период цикла в тысячи раз длиннее: synth в каждом Racing::new вешает тесты гонок до таймаута, длину держит synth_is_one_revolution….
    "engine_sound.rs:36:(42: replace \\* with \\+|49: replace / with \\*) in synth$",
    # Высота травы ровно на допуске от BASE — граница нулевой меры.
    "replace < with <= in base_grass$",
    # При нулевом газе обе ветки дают силу 0.
    "replace < with <= in drive_force$",
    # Бит `COPY_DST` не пересекается с `MAP_READ`: `|` и `^` равны.
    "replace \\| with \\^ in read_texture$",
    # Адаптер тестов даёт `VIEW_FORMATS`, ветку «без флага» не воспроизвести; выбор формата проверен в linear_only_with_both_flags.
    "replace Canvas::has_linear_view -> bool with true$",
]
