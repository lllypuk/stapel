# Склейка с окном, циклом событий, поверхностью и звуковой картой (`fill` под тестами в audio/mod.rs, логика поверхности — в surface.rs): проверяется запуском игры.
# renderer.rs — глобом: мутанты «delete field» в cargo-mutants 27.1 не фильтруются exclude_re.
exclude_globs = ["engine/src/app.rs", "engine/src/renderer.rs", "engine/src/audio/device.rs"]
exclude_re = [
    # fn main игр и engine::run открывают окно; глоб по main.rs выключил бы логику игр.
    "replace main -> ",
    " in main$",
    "replace run -> ",
    # | и ^ на непересекающихся битовых флагах wgpu дают одно и то же.
    "replace \\| with \\^ in (GpuTextures::upload|instance_buffer|palette_buffer)$",
    # Левый край твёрдой клетки ровно под центром — круг уже в стене, из корректного положения недостижимо.
    "replace > with >= in slide$",
    # Расстояние ровно PICKUP до предмета — граница нулевой меры, ходьбой не воспроизводится.
    "replace < with <= in touches_item$",
    # Форма волны мерцания произвольна; тесты держат границы, разброс, разницу факелов и зависимость от тика.
    "replace [+*] with [-+*/] in flicker$",
    # Соседи ячейки склейки перебираются по −1..=1 — вычитание обходит те же ячейки.
    "replace \\+ with - in Welder::id$",
    # Равные расстояния до двух рёбер — только в их общей вершине, оба дают её.
    "replace < with <= in closest_point$",
    # Ровно на боку или ровно на −10 м — граница нулевой меры, физикой не воспроизводится.
    "replace < with <= in Racing::auto_respawn$",
    # Нулевая оставшаяся глубина прибавляет к сдвигу ноль.
    "replace > with >= in solve_contacts$",
]
