[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# Транзитивные unmaintained из wgpu/winit не исправить.
unmaintained = "workspace"

[licenses]
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Zlib"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
